<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribución de Personal - Tatamis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas para descargar la imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        
        /* Efecto de texto legible sobre el tatami con un ligero sombreado */
        .texto-tatami {
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8), 0px 0px 2px rgba(0, 0, 0, 0.9);
            line-height: 1.4;
        }

        /* Líneas de inicio típicas de Kumite en el medio del tatami */
        .marcas-tatami::before, .marcas-tatami::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.4);
            top: 50%;
            transform: translateY(-50%);
        }
        .marcas-tatami::before { left: 15%; }
        .marcas-tatami::after { right: 15%; }

        /* Estilos especiales al tomar la foto */
        .modo-captura .controles-input {
            display: none !important;
        }
        .modo-captura {
            background-color: #ffffff;
            padding: 30px;
        }
        .modo-captura .tarjeta-tatami {
            box-shadow: none;
            border: none;
            background: transparent;
        }
        .modo-captura .titulo-tatami {
            color: #1e293b; /* Texto oscuro para el título en la captura */
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white py-5 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-center sm:justify-start gap-3">
            <span class="text-2xl">🥋</span>
            <h1 class="text-xl font-bold tracking-tight">Organizador de Tatamis WKF</h1>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-slate-200 flex flex-col sm:flex-row gap-5 items-end justify-between">
            <div class="w-full sm:w-1/3">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Número de áreas (Tatamis)</label>
                <div class="relative">
                    <select id="selector-tatamis" class="w-full appearance-none rounded-xl border border-slate-300 bg-slate-50 py-3 px-4 text-slate-700 focus:border-blue-500 focus:ring-blue-500 font-medium transition-colors cursor-pointer">
                        <option value="1">1 Tatami</option>
                        <option value="2">2 Tatamis</option>
                        <option value="3">3 Tatamis</option>
                        <option value="4" selected>4 Tatamis</option>
                        <option value="5">5 Tatamis</option>
                        <option value="6">6 Tatamis</option>
                        <option value="8">8 Tatamis</option>
                        <option value="10">10 Tatamis</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>
            
            <button id="btn-descargar" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition-all flex items-center justify-center gap-3 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Descargar Distribución
            </button>
        </div>

        <div id="zona-exportacion" class="rounded-2xl transition-colors">
            <div id="contenedor-tatamis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- Los tatamis se insertarán aquí por JavaScript -->
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('selector-tatamis');
            const contenedor = document.getElementById('contenedor-tatamis');
            const zonaExportacion = document.getElementById('zona-exportacion');
            const btnDescargar = document.getElementById('btn-descargar');

            generarTatamis();
            selector.addEventListener('change', generarTatamis);

            function generarTatamis() {
                const cantidad = parseInt(selector.value);
                contenedor.innerHTML = '';

                for (let i = 1; i <= cantidad; i++) {
                    contenedor.insertAdjacentHTML('beforeend', crearPlantillaTatami(i));
                }
                vincularInputs();
            }

            function crearPlantillaTatami(num) {
                return `
                <div class="tarjeta-tatami bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col group hover:shadow-md transition-shadow">
                    
                    <!-- Representación Gráfica del Tatami -->
                    <div class="p-5 bg-slate-50 flex flex-col items-center">
                        <h2 class="titulo-tatami text-xl font-bold text-slate-700 mb-4 tracking-wide">TATAMI ${num}</h2>
                        
                        <div class="w-64 h-64 bg-blue-600 p-4 rounded-lg relative flex justify-center items-center shadow-inner">
                            <!-- Cuadrado Rojo Interior con marcas de Kumite -->
                            <div class="marcas-tatami w-full h-full bg-red-600 rounded-md relative flex flex-col justify-center items-center p-3 shadow-md overflow-hidden">
                                
                                <!-- Número de fondo translúcido -->
                                <span class="absolute inset-0 flex items-center justify-center text-8xl font-black text-white opacity-10 pointer-events-none select-none">${num}</span>
                                
                                <!-- Contenedor de Texto Unificado (Aparecerá aquí la lista) -->
                                <div id="pantalla-unificada-${num}" class="texto-tatami text-white font-medium text-[15px] relative z-10 text-center w-full break-words">
                                    <!-- El contenido se inyecta por JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="controles-input p-5 flex flex-col gap-4 flex-grow bg-white border-t border-slate-100">
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-lg">📋</span>
                            <input type="text" id="input-jefe-${num}" data-tatami="${num}" placeholder="Jefe de Tatami" class="w-full border border-slate-300 rounded-lg pl-10 pr-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-shadow bg-slate-50 focus:bg-white">
                        </div>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-lg">💻</span>
                            <input type="text" id="input-ordenador-${num}" data-tatami="${num}" placeholder="Ordenador" class="w-full border border-slate-300 rounded-lg pl-10 pr-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-shadow bg-slate-50 focus:bg-white">
                        </div>
                        <div>
                            <textarea id="input-staff-${num}" data-tatami="${num}" rows="2" placeholder="Nombres del staff (uno por línea)..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none transition-shadow bg-slate-50 focus:bg-white"></textarea>
                        </div>
                    </div>
                </div>
                `;
            }

            function vincularInputs() {
                const inputs = document.querySelectorAll('.controles-input input, .controles-input textarea');
                inputs.forEach(input => {
                    input.addEventListener('input', (e) => {
                        const numTatami = e.target.getAttribute('data-tatami');
                        actualizarPantallaTatami(numTatami);
                    });
                });
            }

            function actualizarPantallaTatami(num) {
                const jefe = document.getElementById(`input-jefe-${num}`).value.trim();
                const ordenador = document.getElementById(`input-ordenador-${num}`).value.trim();
                const staff = document.getElementById(`input-staff-${num}`).value.trim();
                
                let lineas = [];
                
                // Construir la lista unificada añadiendo los emojis correspondientes
                if (jefe) lineas.push(`📋 ${jefe}`);
                if (ordenador) lineas.push(`💻 ${ordenador}`);
                
                if (staff) {
                    // Si hay varias líneas de staff, las separamos y añadimos
                    const lineasStaff = staff.split('\n').map(l => l.trim()).filter(l => l !== '');
                    lineas = lineas.concat(lineasStaff);
                }

                // Unimos todo con saltos de línea HTML y lo inyectamos
                const pantalla = document.getElementById(`pantalla-unificada-${num}`);
                pantalla.innerHTML = lineas.join('<br>');
            }

            btnDescargar.addEventListener('click', async () => {
                const textoOriginal = btnDescargar.innerHTML;
                btnDescargar.innerHTML = 'Generando imagen...';
                btnDescargar.disabled = true;

                // Aplicamos la clase para ocultar los inputs y dejar fondo blanco
                zonaExportacion.classList.add('modo-captura');

                // Pequeña pausa para asegurar que el DOM actualiza los estilos
                await new Promise(resolve => setTimeout(resolve, 100));

                try {
                    const canvas = await html2canvas(zonaExportacion, {
                        scale: 2, // Calidad retina
                        backgroundColor: '#ffffff',
                        useCORS: true,
                        logging: false
                    });

                    const enlace = document.createElement('a');
                    enlace.download = 'Distribucion-Personal-Tatamis.png';
                    enlace.href = canvas.toDataURL('image/png');
                    enlace.click();

                } catch (error) {
                    console.error("Error al generar la imagen:", error);
                    alert("Hubo un problema al crear la imagen. Inténtalo de nuevo.");
                } finally {
                    zonaExportacion.classList.remove('modo-captura');
                    btnDescargar.innerHTML = textoOriginal;
                    btnDescargar.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
