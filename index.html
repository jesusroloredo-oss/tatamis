<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Flexible de Tatamis</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Sombra para mejorar la legibilidad de los nombres en el tatami */
        .text-shadow {
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8), 0 0 5px rgba(0,0,0,0.6);
        }

        /* Slots (huecos) de la cuadrícula de 4x4 */
        .slot {
            min-height: 380px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        /* Líneas blancas del área de combate (Kumite) */
        .linea-kumite {
            position: absolute;
            width: 4px;
            height: 25%;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 2px;
            top: 37.5%;
        }
        .linea-izquierda { left: 18%; }
        .linea-derecha { right: 18%; }

        /* Icono de arrastre */
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        /* Reglas de exportación para limpiar la imagen capturada */
        body.export-mode .inputs-container,
        body.export-mode .drag-handle {
            display: none !important;
        }
        
        body.export-mode .slot {
            border-color: transparent !important;
            background-color: transparent !important;
            min-height: auto !important; 
        }
        
        body.export-mode #capture-area {
            background-color: #ffffff; 
            padding: 20px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Controles Superiores (NO salen en la foto) -->
    <div class="max-w-[1400px] w-full bg-white rounded-2xl shadow-md p-6 mb-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span>🥋</span> Distribución de Tatamis
            </h1>
            
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <div class="w-full sm:w-48">
                    <select id="select-tatamis" class="w-full border-gray-300 rounded-lg shadow-sm border p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="1">1 Tatami</option>
                        <option value="2">2 Tatamis</option>
                        <option value="3">3 Tatamis</option>
                        <option value="4">4 Tatamis</option>
                        <option value="5">5 Tatamis</option>
                        <option value="6" selected>6 Tatamis</option>
                        <option value="7">7 Tatamis</option>
                        <option value="8">8 Tatamis</option>
                        <option value="9">9 Tatamis</option>
                        <option value="10">10 Tatamis</option>
                        <option value="11">11 Tatamis</option>
                        <option value="12">12 Tatamis</option>
                        <option value="13">13 Tatamis</option>
                        <option value="14">14 Tatamis</option>
                        <option value="15">15 Tatamis</option>
                        <option value="16">16 Tatamis</option>
                    </select>
                </div>
                
                <button id="btn-generar" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-lg shadow transition-colors">
                    Generar Tatamis
                </button>
                
                <button id="btn-descargar" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-6 rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    Descargar Foto
                </button>
            </div>
        </div>

        <!-- Sección de Personal Disponible -->
        <div class="mt-4 pt-4 border-t border-gray-100">
            <h2 class="text-lg font-semibold text-gray-700 mb-3 flex items-center gap-2">
                <span>📋</span> Personal Disponible
            </h2>
            <div class="flex flex-col sm:flex-row gap-4 items-start">
                <textarea id="staff-textarea" rows="3" class="w-full sm:w-1/3 border border-gray-300 rounded-lg p-3 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none resize-none shadow-sm" placeholder="Pega aquí los nombres (uno por línea)..."></textarea>
                
                <div class="w-full sm:w-2/3 flex flex-col items-start gap-3">
                    <button id="btn-cargar-staff" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors shadow">
                        Cargar Lista
                    </button>
                    <!-- Contenedor donde aparecerán las etiquetas de personal -->
                    <div id="staff-badges" class="flex flex-wrap gap-2 w-full">
                        <span class="text-gray-400 text-sm italic">Carga la lista para ver al personal aquí. Se tacharán al asignarlos a un tatami.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Área de Captura (Esto ES lo que sale en la foto) -->
    <div class="max-w-[1400px] w-full bg-white rounded-2xl shadow-sm p-4 overflow-hidden">
        <!-- Cuadrícula 4x4 (16 slots fijos) -->
        <div id="capture-area" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 p-4 rounded-xl">
            <!-- Los 16 slots se inyectarán aquí -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const captureArea = document.getElementById('capture-area');
            const btnGenerar = document.getElementById('btn-generar');
            const btnDescargar = document.getElementById('btn-descargar');
            const selectTatamis = document.getElementById('select-tatamis');
            
            // Elementos del Personal
            const staffTextarea = document.getElementById('staff-textarea');
            const btnCargarStaff = document.getElementById('btn-cargar-staff');
            const staffBadgesContainer = document.getElementById('staff-badges');
            let staffList = [];

            // 1. Lógica del Personal Disponible
            btnCargarStaff.addEventListener('click', () => {
                const text = staffTextarea.value;
                // Separar por líneas, quitar espacios vacíos y filtrar líneas en blanco
                staffList = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
                renderStaffBadges();
                checkStaffCrossOut(); // Comprobar por si ya hay gente asignada
            });

            function renderStaffBadges() {
                staffBadgesContainer.innerHTML = '';
                if (staffList.length === 0) {
                    staffBadgesContainer.innerHTML = '<span class="text-gray-400 text-sm italic">Lista vacía.</span>';
                    return;
                }

                staffList.forEach(name => {
                    const badge = document.createElement('span');
                    // Estilos por defecto (no tachado)
                    badge.className = 'staff-badge bg-blue-100 text-blue-800 border border-blue-200 text-sm font-medium px-2.5 py-1 rounded-md transition-all duration-300';
                    badge.textContent = name;
                    staffBadgesContainer.appendChild(badge);
                });
            }

            // 2. Función de tachado automático
            function checkStaffCrossOut() {
                // Obtener TODO el texto de todos los inputs de los tatamis
                const allInputs = document.querySelectorAll('.tatami-input');
                let globalText = '';
                allInputs.forEach(inp => {
                    globalText += ' ' + inp.value.toLowerCase();
                });

                // Revisar cada etiqueta de personal
                const badges = document.querySelectorAll('.staff-badge');
                badges.forEach(badge => {
                    const name = badge.textContent.toLowerCase();
                    
                    // Si el nombre del badge está contenido en lo que se ha escrito en los tatamis...
                    if (globalText.includes(name)) {
                        // Tachar visualmente
                        badge.classList.remove('bg-blue-100', 'text-blue-800', 'border-blue-200');
                        badge.classList.add('bg-gray-100', 'text-gray-400', 'line-through', 'border-gray-200');
                    } else {
                        // Restaurar (no tachado)
                        badge.classList.add('bg-blue-100', 'text-blue-800', 'border-blue-200');
                        badge.classList.remove('bg-gray-100', 'text-gray-400', 'line-through', 'border-gray-200');
                    }
                });
            }

            // 3. Inicializar los 16 huecos (Grid 4x4)
            function inicializarSlots() {
                captureArea.innerHTML = '';
                for (let i = 1; i <= 16; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot border-2 border-dashed border-gray-300 rounded-xl p-2 flex flex-col gap-2 bg-gray-50 bg-opacity-40';
                    slot.id = `slot-${i}`;
                    captureArea.appendChild(slot);

                    // Hacer cada hueco arrastrable
                    new Sortable(slot, {
                        group: 'shared',
                        animation: 150,
                        handle: '.drag-handle',
                        ghostClass: 'opacity-40',
                        fallbackOnBody: true,
                        swapThreshold: 0.65
                    });
                }
            }

            // 4. Generar tarjetas de Tatamis
            function generarTatamis() {
                const cantidad = parseInt(selectTatamis.value);
                const slots = document.querySelectorAll('.slot');
                
                // Limpiar todos los slots antes de generar
                slots.forEach(slot => { slot.innerHTML = ''; });

                for (let i = 1; i <= cantidad; i++) {
                    const tarjetaHTML = `
                        <div class="tarjeta-tatami bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm flex flex-col h-full" data-id="${i}">
                            <div class="bg-gray-100 px-3 py-2.5 flex items-center justify-between border-b border-gray-200">
                                <span class="font-bold text-gray-700 text-sm">Tatami ${i}</span>
                                <div class="drag-handle text-gray-400 hover:text-gray-600 transition-colors p-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
                                </div>
                            </div>

                            <div class="p-3 flex-grow flex items-center justify-center bg-gray-50">
                                <!-- Borde Rojo exterior -->
                                <div class="w-full aspect-square max-w-[220px] bg-red-600 rounded-lg p-3 relative shadow-inner">
                                    <!-- Centro Azul interior -->
                                    <div class="w-full h-full bg-blue-600 rounded relative flex items-center justify-center overflow-hidden shadow">
                                        
                                        <!-- Marca de agua numérica -->
                                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
                                            <span class="text-[7rem] font-black text-white opacity-20">${i}</span>
                                        </div>

                                        <div class="linea-kumite linea-izquierda"></div>
                                        <div class="linea-kumite linea-derecha"></div>
                                        
                                        <!-- Texto superpuesto -->
                                        <div id="texto-tatami-${i}" class="relative z-10 text-white text-center text-shadow font-semibold text-xs sm:text-sm w-full px-1 leading-relaxed break-words">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Controles Inferiores de cada Tatami -->
                            <div class="inputs-container p-3 border-t border-gray-200 bg-white space-y-2">
                                <input type="text" id="input-ordenador-${i}" data-target="${i}" placeholder="💻 Ordenador" class="tatami-input w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <input type="text" id="input-jefe-${i}" data-target="${i}" placeholder="📋 Jefe de Tatami" class="tatami-input w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <input type="text" id="input-staff-${i}" data-target="${i}" placeholder="Staff adicional" class="tatami-input w-full border border-gray-300 rounded px-2.5 py-1.5 text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    `;
                    
                    document.getElementById(`slot-${i}`).innerHTML = tarjetaHTML;
                    actualizarTextoTatami(i);
                }
                
                // Al generar nuevos tatamis, comprobar tachados
                checkStaffCrossOut();
            }

            // 5. Escuchar inputs para actualizar gráficos y lista de personal
            captureArea.addEventListener('input', (e) => {
                if (e.target.classList.contains('tatami-input')) {
                    const id = e.target.getAttribute('data-target');
                    actualizarTextoTatami(id);
                    checkStaffCrossOut(); // Llama a la comprobación de tachado en tiempo real
                }
            });

            function actualizarTextoTatami(id) {
                const ordenador = document.getElementById(`input-ordenador-${id}`)?.value.trim() || '';
                const jefe = document.getElementById(`input-jefe-${id}`)?.value.trim() || '';
                const staff = document.getElementById(`input-staff-${id}`)?.value.trim() || '';

                let lineas = [];
                if (ordenador) lineas.push(`💻 ${ordenador}`);
                if (jefe) lineas.push(`📋 ${jefe}`);
                if (staff) {
                    // Si hay varios nombres separados por comas en el staff, se ponen en líneas nuevas
                    const staffFormat = staff.split(',').map(s => s.trim()).join('<br>');
                    lineas.push(staffFormat);
                }

                const contenedorTexto = document.getElementById(`texto-tatami-${id}`);
                if (contenedorTexto) {
                    contenedorTexto.innerHTML = lineas.join('<br>');
                }
            }

            // 6. Descarga de Imagen
            btnDescargar.addEventListener('click', async () => {
                const textoOriginal = btnDescargar.innerHTML;
                btnDescargar.innerHTML = '📸 Procesando...';
                btnDescargar.disabled = true;

                // Ocultar inputs y bordes
                document.body.classList.add('export-mode');
                
                // Esperar un instante para que el navegador aplique el CSS
                await new Promise(resolve => setTimeout(resolve, 300));

                try {
                    const canvas = await html2canvas(captureArea, {
                        scale: 2, 
                        backgroundColor: '#ffffff',
                        logging: false
                    });

                    const enlace = document.createElement('a');
                    enlace.download = 'Distribucion-Tatamis-Karate.png';
                    enlace.href = canvas.toDataURL('image/png');
                    enlace.click();
                } catch (error) {
                    console.error("Error capturando la imagen:", error);
                    alert("Ocurrió un problema al exportar la foto.");
                } finally {
                    document.body.classList.remove('export-mode');
                    btnDescargar.innerHTML = textoOriginal;
                    btnDescargar.disabled = false;
                }
            });

            // Iniciar por primera vez
            inicializarSlots();
            btnGenerar.addEventListener('click', generarTatamis);
            generarTatamis(); 
        });
    </script>
</body>
</html>
